kep_warehouse:
  target: sandbox
  outputs:
    sandbox:
      type: bigquery
      method: oauth
      project: "{{ env_var('KEP_GCP_PROJECT') }}"
      dataset: "{{ env_var('KEP_BQ_DATASET') }}"
      location: "{{ env_var('KEP_BQ_LOCATION', 'US') }}"
      threads: 2
      priority: interactive
      maximum_bytes_billed: 1073741824
      job_execution_timeout_seconds: 120
      job_retries: 1
