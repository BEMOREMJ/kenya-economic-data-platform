[project]
name = "kenya-economic-data-platform"
version = "0.1.0"
description = "Bounded local extraction foundation for a Kenya economic data platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery==1.12.1",
    "dbt-core==1.12.5",
]

[project.scripts]
kenya-econ = "kenya_economic_data.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenya_economic_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

